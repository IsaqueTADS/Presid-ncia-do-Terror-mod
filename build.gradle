plugins { id 'fabric-loom' version '1.10.5' }
version = '0.1.2'
group = 'dev.presidencia'
base { archivesName = 'presidencia-do-terror' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
 modImplementation 'net.fabricmc:fabric-loader:0.16.14'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.7+1.21.1'
}
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21 }
sourceSets { gametest { compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output; runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output } }
loom {
 mods { presidencia_terror { sourceSet sourceSets.main }; presidencia_tests { sourceSet sourceSets.gametest } }
 runs { gametest { server(); source sourceSets.gametest; vmArg '-Dfabric-api.gametest'; vmArg '-Dfabric-api.gametest.report-file=../build/gametest-results.xml'; runDir 'build/gametest' } }
}
